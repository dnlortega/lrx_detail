<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fundo escuro sutil -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f232b" />
      <stop offset="70%" stop-color="#0f1115" />
      <stop offset="100%" stop-color="#08090b" />
    </radialGradient>
    
    <!-- Brilho no X vermelho -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3344" />
      <stop offset="100%" stop-color="#d90416" />
    </linearGradient>

    <!-- Filtro de sombra e relevo -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="redNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ff2233" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Círculo Base Preto -->
  <circle cx="200" cy="200" r="188" fill="url(#bgGrad)" stroke="#222730" stroke-width="4" filter="url(#subtleGlow)" />
  
  <!-- Anel fino decorativo -->
  <circle cx="200" cy="200" r="176" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" />

  <!-- Grupo do Texto Central LRX -->
  <g transform="translate(200, 192)" text-anchor="middle" dominant-baseline="central">
    <!-- Texto LR em Branco -->
    <text x="-32" y="0" font-family="'Inter', 'Montserrat', 'Arial Black', sans-serif" font-size="112" font-weight="900" fill="#FFFFFF" letter-spacing="-2">LR</text>
    
    <!-- Letra X em Vermelho Vibrante -->
    <text x="64" y="0" font-family="'Inter', 'Montserrat', 'Arial Black', sans-serif" font-size="114" font-weight="900" fill="url(#redGrad)" filter="url(#redNeon)" letter-spacing="-2">X</text>
  </g>

  <!-- Subtítulo DETAIL com espaçamento refinado -->
  <g transform="translate(200, 268)" text-anchor="middle" dominant-baseline="central">
    <text font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#E2E8F0" letter-spacing="12">DETAIL</text>
  </g>
</svg>
